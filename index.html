<style>
  :root { --speed: 1; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f172a;
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;

  header { text-align: center; padding: 18px 12px 6px; }

  header p { margin: 6px 0 0; font-size: 13px; color: #94a3b8; }
  header code { background: #1e293b; padding: 2px 8px; border-radius: 6px; color: #fcd34d; }
  .stage {
    width: min(960px, 96vw); border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 1px solid #334155;
    background: skyblue;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 12px; flex-wrap: wrap; font-size: 14px;
  }
  .controls button {
    background: #f59e0b; border: none; border-radius: 999px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; font-weight: 700;
  }
  .controls button:active { transform: scale(.96); }
  .controls input[type=range] { width: 160px; accent-color: #f59e0b; }
  footer { font-size: 12px; color: #64748b; padding: 8px 0 22px; }

  /* ===== scene motion ===== */
  .cloud-a { animation: drift 26s linear infinite; }
  .cloud-b { animation: drift 38s linear infinite; }
  .cloud-c { animation: drift 32s linear infinite; }
  @keyframes drift { from { transform: translateX(1050px); } to { transform: translateX(-350px); } }

  .hill-back { animation: slideSlow 14s linear infinite; }
  .trees { animation: slideFast 3.2s linear infinite; }
  @keyframes slideSlow { from { transform: translateX(0); } to { transform: translateX(-240px); } }
  @keyframes slideFast { from { transform: translateX(0); } to { transform: translateX(-320px); } }

  .road-dash { animation: dash 0.55s linear infinite; }
  @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -72; } }

  /* ===== bike ===== */
  .bike-bob { animation: bob .55s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-5px) rotate(-.4deg); } }
  .wheel-spin { animation: spin .9s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .crank-spin { animation: spin .9s linear infinite; transform-box: fill-box; transform-origin: center; }

  /* ===== pelican ===== */
  .pelican-bob { animation: pbob .55s ease-in-out infinite alternate; }
  @keyframes pbob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  .wing { animation: flap .55s ease-in-out infinite alternate; transform-origin: 470px 245px; transform-box: view-box; }
  @keyframes flap { from { transform: rotate(-10deg); } to { transform: rotate(22deg); } }
  .pouch { animation: wobble .55s ease-in-out infinite alternate; transform-origin: 640px 178px; }
  @keyframes wobble { from { transform: scaleY(1) rotate(0deg); } to { transform: scaleY(1.08) rotate(1.5deg); } }
  .scarf-tail { animation: wave .4s ease-in-out infinite alternate; transform-origin: 545px 200px; }
  @keyframes wave { from { transform: rotate(-6deg) skewX(-4deg); } to { transform: rotate(8deg) skewX(6deg); } }
  .eye-lid { animation: blink 4s infinite; transform-origin: 592px 152px; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .dust { animation: puff 1s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .dust.d2 { animation-delay: .33s; } .dust.d3 { animation-delay: .66s; }
  @keyframes puff {
    0% { opacity: .7; transform: translate(0,0) scale(.5); }
    100% { opacity: 0; transform: translate(-90px,-30px) scale(1.6); }
  }
  .bell-text { animation: ring 1.6s ease-in-out infinite; opacity: 0; }
  @keyframes ring { 0%,70%,100% { opacity: 0; transform: translateY(6px); } 15%,45% { opacity: 1; transform: translateY(0); } }
</style>

<script>
  const svg = document.querySelector('svg');
  const speedInput = document.getElementById('speed');
  function applySpeed(v) {
    document.querySelectorAll('.wheel-spin,.crank-spin').forEach(el => el.style.animationDuration = (0.9 / v) + 's');
    document.querySelectorAll('.bike-bob,.pelican-bob,.wing,.pouch').forEach(el => el.style.animationDuration = (0.55 / v) + 's');
    document.querySelectorAll('.road-dash').forEach(el => el.style.animationDuration = (0.55 / v) + 's');
    document.querySelectorAll('.trees').forEach(el => el.style.animationDuration = (3.2 / v) + 's');
    // SMIL legs: set dur via setAttribute
    document.querySelectorAll('animate[dur="0.9s"]').forEach(a => a.setAttribute('dur', (0.9 / v) + 's'));
  }
  speedInput.addEventListener('input', e => applySpeed(parseFloat(e.target.value)));
  document.getElementById('slower').onclick = () => { speedInput.value = Math.max(0.3, parseFloat(speedInput.value) - 0.2); applySpeed(parseFloat(speedInput.value)); };
  document.getElementById('faster').onclick = () => { speedInput.value = Math.min(2.5, parseFloat(speedInput.value) + 0.2); applySpeed(parseFloat(speedInput.value)); };
  function ring() {
    const t = document.querySelector('.bell-text');
    t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
    // simple beep
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [880, 1174].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.2);
        o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + i * 0.15); o.stop(ctx.currentTime + i * 0.15 + 0.25);
      });
    } catch (e) {}
  }
  document.getElementById('bell').addEventListener('click', ring);
  document.getElementById('bellBtn').addEventListener('click', ring);
</script>
